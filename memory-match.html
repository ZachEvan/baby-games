<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>翻翻乐 · 记忆配对</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #e3f2fd 0%, #f3e8ff 50%, #fde9f0 100%);
  }

  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: calc(var(--safe-top) + 10px) calc(var(--safe-right) + 14px) calc(var(--safe-bottom) + 12px) calc(var(--safe-left) + 14px);
  }

  #top {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 4px 0 10px;
  }
  #top .title { font-size: 24px; font-weight: 700; color: #5a4a86; letter-spacing: 2px; }
  #stars { display: flex; gap: 6px; }
  #stars .star {
    width: 26px; height: 26px; border-radius: 50%;
    background: #ece6f5;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #c9bfe0;
    transition: all .3s ease;
  }
  #stars .star.on {
    background: #ffd54f; color: #fff;
    transform: scale(1.15);
    box-shadow: 0 2px 6px rgba(255,193,7,.5);
  }

  #board {
    flex: 1;
    display: grid;
    gap: 12px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    align-content: center;
  }

  .card {
    perspective: 900px;
    aspect-ratio: 1;
    cursor: pointer;
    position: relative;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .45s cubic-bezier(.35,.15,.25,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(40px, 15vmin, 92px);
    line-height: 1;
  }
  .card-back {
    background: linear-gradient(145deg, #b39ddb, #8e7cc3);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 0 4px 10px rgba(120,100,180,.35);
    color: rgba(255,255,255,.9);
  }
  .card-front {
    background: #ffffff;
    box-shadow: inset 0 0 0 3px #e8e0f7, 0 4px 10px rgba(120,100,180,.25);
    transform: rotateY(180deg);
  }
  .card.matched .card-front {
    box-shadow: inset 0 0 0 4px #ffd54f, 0 4px 14px rgba(255,193,7,.5);
    animation: pop .45s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.14); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  #win {
    position: fixed; inset: 0;
    background: rgba(60,40,90,.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #win.show { opacity: 1; pointer-events: auto; }
  .win-box {
    background: #fff; border-radius: 26px;
    padding: 34px 40px; text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
    transform: scale(.8); transition: transform .35s cubic-bezier(.3,1.4,.5,1);
  }
  #win.show .win-box { transform: scale(1); }
  .win-emoji { font-size: 72px; line-height: 1; }
  .win-text { font-size: 26px; font-weight: 700; color: #5a4a86; margin: 14px 0 24px; }
  #replay {
    font-size: 24px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #ff9a9e, #f857a6);
    border: none; border-radius: 40px;
    padding: 14px 42px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(248,87,166,.45);
  }
  #replay:active { transform: scale(.96); }

  .confetti {
    position: fixed; top: -24px;
    width: 12px; height: 16px;
    border-radius: 3px;
    z-index: 40; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(760deg); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="title">翻翻乐</span>
    <div id="stars"></div>
  </div>
  <div id="board"></div>
</div>

<div id="win">
  <div class="win-box">
    <div class="win-emoji">🎉</div>
    <div class="win-text">太棒了！</div>
    <button id="replay">再来一局</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const ANIMALS = [
    { e: "🐱", key: "cat" },
    { e: "🐶", key: "dog" },
    { e: "🦆", key: "duck" },
    { e: "🐤", key: "chick" },
    { e: "🐷", key: "pig" },
    { e: "🐸", key: "frog" }
  ];
  const PAIRS = 6;

  const board = document.getElementById("board");
  const starsEl = document.getElementById("stars");
  const winEl = document.getElementById("win");
  const replayBtn = document.getElementById("replay");

  let cards = [];
  let first = null, second = null, lock = false;
  let matchedCount = 0;
  let audioCtx = null;

  // ---------- 音效 ----------
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(freq, type, start, dur, peak) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function flipSound() { tone(520, "sine", 0, 0.08, 0.18); }

  function mismatchSound() {
    tone(330, "triangle", 0, 0.18, 0.2);
    tone(250, "triangle", 0.12, 0.22, 0.2);
  }

  function animalSound(key) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    if (key === "cat") {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(360, t);
      o.frequency.linearRampToValueAtTime(820, t + 0.16);
      o.frequency.linearRampToValueAtTime(380, t + 0.42);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.05);
      g.gain.setValueAtTime(0.35, t + 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.52);
    } else if (key === "dog") {
      [0, 0.22].forEach(function (d) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(300, t + d);
        o.frequency.exponentialRampToValueAtTime(170, t + d + 0.09);
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.32, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.11);
        o.connect(g); g.connect(audioCtx.destination); o.start(t + d); o.stop(t + d + 0.12);
      });
    } else if (key === "duck") {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(260, t);
      lfo.frequency.value = 28; lg.gain.value = 35;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.32); lfo.start(t); lfo.stop(t + 0.32);
    } else if (key === "chick") {
      for (let i = 0; i < 3; i++) {
        const d = i * 0.09;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(1350, t + d);
        o.frequency.linearRampToValueAtTime(1050, t + d + 0.06);
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.07);
        o.connect(g); g.connect(audioCtx.destination); o.start(t + d); o.stop(t + d + 0.08);
      }
    } else if (key === "pig") {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(280, t);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.18);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.22);
    } else if (key === "frog") {
      [0, 0.18].forEach(function (d) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(160, t + d);
        o.frequency.exponentialRampToValueAtTime(90, t + d + 0.07);
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.28, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.09);
        o.connect(g); g.connect(audioCtx.destination); o.start(t + d); o.stop(t + d + 0.1);
      });
    }
  }

  function matchSound(key) {
    tone(660, "sine", 0, 0.12, 0.25);
    tone(880, "sine", 0.08, 0.16, 0.25);
    setTimeout(function () { animalSound(key); }, 140);
  }

  function winSound() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      tone(f, "triangle", i * 0.12, 0.28, 0.28);
    });
  }

  // ---------- 游戏 ----------
  function buildStars() {
    starsEl.innerHTML = "";
    for (let i = 0; i < PAIRS; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.textContent = "★";
      starsEl.appendChild(s);
    }
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function newGame() {
    ensureAudio();
    winEl.classList.remove("show");
    matchedCount = 0;
    first = second = null;
    lock = false;
    buildStars();

    // 随机挑 PAIRS 种动物，各两份，洗牌
    const pool = shuffle(ANIMALS.slice()).slice(0, PAIRS);
    const deck = shuffle(pool.concat(pool));

    board.innerHTML = "";
    cards = deck.map(function (animal) {
      const cardEl = document.createElement("div");
      cardEl.className = "card";
      cardEl.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back">⭐</div>' +
          '<div class="card-face card-front">' + animal.e + '</div>' +
        '</div>';
      const cardObj = { el: cardEl, animal: animal, flipped: false, matched: false };
      cardEl.addEventListener("click", function () { onCardClick(cardObj); });
      board.appendChild(cardEl);
      return cardObj;
    });
    layout();
  }

  function onCardClick(card) {
    if (lock || card.matched || card.flipped) return;
    ensureAudio();
    card.flipped = true;
    card.el.classList.add("flipped");
    flipSound();

    if (!first) {
      first = card;
    } else {
      second = card;
      lock = true;
      if (first.animal.key === second.animal.key) {
        matchFound();
      } else {
        setTimeout(function () {
          first.flipped = second.flipped = false;
          first.el.classList.remove("flipped");
          second.el.classList.remove("flipped");
          first = second = null;
          lock = false;
        }, 750);
        setTimeout(mismatchSound, 260);
      }
    }
  }

  function matchFound() {
    first.matched = second.matched = true;
    first.el.classList.add("matched");
    second.el.classList.add("matched");
    matchSound(first.animal.key);

    // 点亮一颗星
    const stars = starsEl.querySelectorAll(".star");
    if (stars[matchedCount]) stars[matchedCount].classList.add("on");
    matchedCount++;

    first = second = null;
    lock = false;

    if (matchedCount === PAIRS) {
      setTimeout(winGame, 500);
    }
  }

  function winGame() {
    winEl.classList.add("show");
    winSound();
    confetti();
  }

  function confetti() {
    const colors = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#ff9f43", "#c780fa", "#ff8fab"];
    for (let i = 0; i < 48; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (2 + Math.random() * 2.2) + "s";
      c.style.animationDelay = (Math.random() * 0.8) + "s";
      c.style.transform = "scale(" + (0.6 + Math.random() * 0.9) + ")";
      document.body.appendChild(c);
      setTimeout(function () { c.remove(); }, 5000);
    }
  }

  function layout() {
    const landscape = window.innerWidth > window.innerHeight;
    const cols = landscape ? 6 : 4;
    board.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
  }

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 80); });
  replayBtn.addEventListener("click", newGame);

  // ---------- 启动 ----------
  newGame();
})();
</script>
</body>
</html>
