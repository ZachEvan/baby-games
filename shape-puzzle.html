<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="形状拼拼乐">
<title>形状拼拼乐 · 形状认知</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #f4f1fb 100%);
  }
  body {
    display: flex; flex-direction: column; height: 100dvh;
    padding: calc(var(--safe-top)) calc(env(safe-area-inset-right,0px)) calc(var(--safe-bottom)) calc(env(safe-area-inset-left,0px));
  }

  header { text-align: center; padding: 10px 0 2px; }
  header h1 { margin: 0; font-size: clamp(24px, 5vmin, 42px); color: #7c5aa8; font-weight: 700; letter-spacing: 2px; }
  header .sub { font-size: clamp(13px, 2.6vmin, 20px); color: #a894c9; margin-top: 2px; }

  /* 凹槽板 */
  #board {
    flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: clamp(8px, 2vmin, 20px); padding: 12px 14px;
    align-content: center; justify-content: center;
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  .slot {
    position: relative; display: flex; align-items: center; justify-content: center;
    border-radius: 26px;
    box-shadow: inset 0 0 0 4px var(--slot-border, #e0d8ee), 0 6px 16px rgba(0,0,0,.10);
    aspect-ratio: 1.05;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  /* 凹槽底色：同色系浅底（加深，更醒目） */
  .slot::before {
    content: ""; position: absolute; inset: 0; border-radius: 22px;
    background: var(--slot-bg, #faf7ff);
    z-index: 0;
  }
  .slot .shape {
    position: relative; width: 66%; height: 66%; z-index: 1;
    opacity: .55;
  }
  .slot .shape svg g {
    fill: none !important;
    stroke: var(--slot-border, #c8bce0);
    stroke-width: 3px;
    stroke-dasharray: 7 5;
  }
  .slot.filled .shape { opacity: 0; }
  .slot .piece {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 62%; height: 62%; z-index: 2;
    animation: pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  .slot.hover { transform: scale(1.1); box-shadow: inset 0 0 0 6px var(--slot-border), 0 0 0 5px rgba(124,90,168,.25), 0 10px 26px rgba(0,0,0,.18); }
  @keyframes pop { 0%{transform:translate(-50%,-50%) scale(.3)} 60%{transform:translate(-50%,-50%) scale(1.18)} 100%{transform:translate(-50%,-50%) scale(1)} }

  /* 待拼形状块 */
  #tray {
    display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2.5vmin, 24px);
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom,0px));
    flex-shrink: 0;
  }
  .block {
    width: clamp(64px, 13vmin, 120px); height: clamp(64px, 13vmin, 120px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
    transition: transform .2s ease;
  }
  .block .shape { width: 100%; height: 100%; filter: drop-shadow(0 5px 7px rgba(0,0,0,.32)); }
  .block .shape svg g { stroke: rgba(255,255,255,.55); stroke-width: 3px; }
  .block.dragging {
    position: fixed; z-index: 1000; margin: 0;
    transform: scale(1.2); pointer-events: none;
  }
  .block.used { display: none; }

  .star { position: fixed; pointer-events: none; z-index: 900; font-size: 40px; animation: floatUp 1s ease-out forwards; }

  #win {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(120,70,120,.35); z-index: 1100;
  }
  #win.show { display: flex; }
  #win .card { background: #fff; border-radius: 26px; padding: 30px 40px; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,.25); }
  #win .big { font-size: 64px; }
  #win h2 { margin: 10px 0 6px; color: #7c5aa8; font-size: 26px; }
  #win button { margin-top: 14px; font-size: 22px; padding: 12px 34px; border: none; border-radius: 999px; background: #b492dd; color: #fff; cursor: pointer; }
  #win button:active { transform: scale(.96); }

  .confetti { position: fixed; top: -20px; z-index: 1200; pointer-events: none; animation: fall linear forwards; }

  @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-100px) scale(1.4);opacity:0} }
  @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

  @media (min-width: 768px) {
    header { padding: 18px 0 6px; }
    #board { max-width: 1100px; gap: 24px; padding: 24px 48px; }
    #tray { gap: 36px; padding: 18px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>🔷 形状拼拼乐</h1>
  <div class="sub">把形状拖回自己的家</div>
</header>
<div id="board"></div>
<div id="tray"></div>
<div id="win">
  <div class="card">
    <div class="big">🎉</div>
    <h2>全都拼对啦！</h2>
    <button id="again">再玩一次</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // 6 种形状：高饱和区分色 + 浅色底 + 描边色
  var SHAPES = [
    { key: 'circle', name: '圆形',   color: '#ef3b5c', bg: '#ffd5dc', border: '#ef3b5c',
      svg: '<circle cx="50" cy="50" r="44" />' },
    { key: 'square', name: '正方形', color: '#3b7be0', bg: '#d2e2ff', border: '#3b7be0',
      svg: '<rect x="10" y="10" width="80" height="80" rx="8" />' },
    { key: 'tri',    name: '三角形', color: '#2fa45c', bg: '#c8f0d6', border: '#2fa45c',
      svg: '<polygon points="50,8 94,88 6,88" />' },
    { key: 'star',   name: '五角星', color: '#f0a800', bg: '#ffe6a3', border: '#f0a800',
      svg: '<polygon points="50,5 61,40 98,40 68,62 79,98 50,76 21,98 32,62 2,40 39,40" />' },
    { key: 'semi',   name: '半圆形', color: '#f27a1e', bg: '#ffd3ae', border: '#f27a1e',
      svg: '<path d="M10,62 A40,40 0 0 1 90,62 Z" />' },
    { key: 'heart',  name: '心形',   color: '#d63ba8', bg: '#fbcbe9', border: '#d63ba8',
      svg: '<path d="M50,88 C20,64 8,46 8,30 C8,16 18,8 28,8 C36,8 44,13 50,22 C56,13 64,8 72,8 C82,8 92,16 92,30 C92,46 80,64 50,88 Z" />' }
  ];

  var boardEl = document.getElementById('board');
  var trayEl = document.getElementById('tray');
  var winEl = document.getElementById('win');

  var audioCtx = null;
  function ac() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + t0;
    var o = c.createOscillator(); var g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function clickSound() { tone('triangle', 660, null, 0, 0.1, 0.25); tone('triangle', 880, null, 0.08, 0.16, 0.22); }
  function wrongSound() { tone('sine', 300, 200, 0, 0.2, 0.2); }
  function winSound() {
    [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { tone('sine', f, null, i * 0.12, 0.25, 0.2); });
  }

  function speak(text) {
    try {
      if ('speechSynthesis' in window) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1.2;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      }
    } catch (e) {}
  }

  function shapeSvg(s, fill) {
    return '<svg viewBox="0 0 100 100" class="shape"><g fill="' + fill + '">' + s.svg + '</g></svg>';
  }
  function findShape(key) {
    return SHAPES.filter(function (x) { return x.key === key; })[0];
  }

  function build() {
    boardEl.innerHTML = '';
    trayEl.innerHTML = '';
    var order = SHAPES.slice().sort(function () { return Math.random() - 0.5; });

    order.forEach(function (s) {
      var slot = document.createElement('div');
      slot.className = 'slot'; slot.dataset.shape = s.key;
      slot.style.setProperty('--slot-bg', s.bg);
      slot.style.setProperty('--slot-border', s.border);
      // 凹槽里放浅色剪影提示（加深描边）
      slot.innerHTML = '<div class="shape">' + shapeSvg(s, s.border) + '</div>';
      boardEl.appendChild(slot);

      var b = document.createElement('div');
      b.className = 'block'; b.dataset.shape = s.key; b.dataset.name = s.name;
      b.innerHTML = shapeSvg(s, s.color);
      b.addEventListener('pointerdown', function (e) { startDrag(b, e); });
      trayEl.appendChild(b);
    });
  }

  // ---------- 拖拽 ----------
  var dragging = null;
  var offX = 0, offY = 0;

  function startDrag(block, e) {
    if (e.cancelable) e.preventDefault();
    if (block.classList.contains('used')) return;
    ac();
    dragging = block;
    var r = block.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    block.classList.add('dragging');
    block.style.left = (e.clientX - offX) + 'px';
    block.style.top = (e.clientY - offY) + 'px';
    block.style.width = r.width + 'px';
    block.style.height = r.height + 'px';
  }

  function moveDrag(e) {
    if (!dragging) return;
    if (e.cancelable) e.preventDefault();
    dragging.style.left = (e.clientX - offX) + 'px';
    dragging.style.top = (e.clientY - offY) + 'px';
    var slot = hitSlot(e.clientX, e.clientY);
    boardEl.querySelectorAll('.slot').forEach(function (s) {
      s.classList.toggle('hover', s === slot);
    });
  }

  function endDrag(e) {
    if (!dragging) return;
    var block = dragging;
    dragging = null;
    boardEl.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('hover'); });

    var slot = hitSlot(e.clientX, e.clientY);
    if (slot && slot.dataset.shape === block.dataset.shape && !slot.classList.contains('filled')) {
      placeBlock(block, slot);
    } else {
      bounceBack(block);
    }
  }

  function hitSlot(x, y) {
    var target = null;
    boardEl.querySelectorAll('.slot').forEach(function (s) {
      var r = s.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) target = s;
    });
    return target;
  }

  function bounceBack(block) {
    block.classList.remove('dragging');
    block.style.transition = 'left .3s ease, top .3s ease';
    block.style.left = '';
    block.style.top = '';
    block.style.width = '';
    block.style.height = '';
    wrongSound();
    setTimeout(function () { block.style.transition = ''; }, 320);
  }

  function placeBlock(block, slot) {
    block.classList.remove('dragging');
    block.classList.add('used');
    block.style.left = ''; block.style.top = ''; block.style.width = ''; block.style.height = '';

    slot.classList.add('filled');
    var s = findShape(slot.dataset.shape);
    var p = document.createElement('div');
    p.className = 'piece';
    p.innerHTML = shapeSvg(s, s.color);
    slot.appendChild(p);

    clickSound();
    speak(block.dataset.name);
    spawnStar(slot);

    placed++;
    if (placed >= SHAPES.length) {
      setTimeout(function () { winEl.classList.add('show'); winSound(); confetti(); }, 500);
    }
  }

  var placed = 0;

  window.addEventListener('pointermove', moveDrag);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function spawnStar(slot) {
    var r = slot.getBoundingClientRect();
    var s = document.createElement('div');
    s.className = 'star'; s.textContent = '⭐';
    s.style.left = (r.left + r.width / 2 - 20) + 'px';
    s.style.top = (r.top - 6) + 'px';
    document.body.appendChild(s);
    setTimeout(function () { s.remove(); }, 1000);
  }

  function confetti() {
    var colors = ['#ef3b5c', '#3b7be0', '#2fa45c', '#f0a800', '#f27a1e', '#d63ba8'];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.width = (6 + Math.random() * 8) + 'px';
      c.style.height = (6 + Math.random() * 8) + 'px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(function () { c.remove(); }, 4500);
    }
  }

  document.getElementById('again').addEventListener('click', function () {
    winEl.classList.remove('show');
    placed = 0;
    build();
  });

  build();
})();
</script>
</body>
</html>
