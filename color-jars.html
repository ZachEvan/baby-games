<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="彩虹罐罐">
<title>彩虹罐罐 · 颜色分类</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #f6f8f3 100%);
  }
  body {
    display: flex; flex-direction: column; height: 100dvh;
    padding: calc(var(--safe-top)) calc(env(safe-area-inset-right,0px)) calc(var(--safe-bottom)) calc(env(safe-area-inset-left,0px));
  }

  header { text-align: center; padding: 10px 0 2px; }
  header h1 { margin: 0; font-size: clamp(24px, 5vmin, 42px); color: #6b7f3a; font-weight: 700; letter-spacing: 2px; }
  header .sub { font-size: clamp(13px, 2.6vmin, 20px); color: #9aab7a; margin-top: 2px; }

  /* 罐子区 */
  #jars {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.5vmin, 16px);
    padding: 8px 12px 0; flex-shrink: 0;
    max-width: 1000px; width: 100%; margin: 0 auto;
  }
  .jar {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    min-height: clamp(90px, 22vmin, 220px);
    border-radius: 22px 22px 14px 14px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .jar.flash { animation: jarFlash .5s ease; }
  @keyframes jarFlash { 0%,100%{transform:scale(1)} 40%{transform:scale(1.08)} }
  .jar .lid {
    width: 74%; height: clamp(10px, 2.2vmin, 18px);
    border-radius: 10px; margin-bottom: -2px;
    background: rgba(0,0,0,.12);
  }
  .jar .body {
    width: 100%; flex: 1; border-radius: 6px 6px 22px 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .jar .cnt {
    font-size: clamp(24px, 6vmin, 48px); font-weight: 800; color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.25);
  }

  /* 待分类物体 */
  #items {
    flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: clamp(12px, 3vmin, 28px); padding: 12px 16px;
    align-content: center;
  }
  .item {
    width: clamp(72px, 16vmin, 150px); height: clamp(72px, 16vmin, 150px);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(44px, 10vmin, 100px); line-height: 1;
    background: #fff; border-radius: 50%;
    box-shadow: 0 6px 18px rgba(0,0,0,.14), inset 0 0 0 3px rgba(0,0,0,.04);
    cursor: pointer; transition: transform .15s ease;
  }
  .item:active { transform: scale(.9); }
  .item.placed { animation: fly .5s ease forwards; }
  @keyframes fly {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.1) translateY(-40px); opacity: 0; }
  }

  /* 反馈 */
  .star { position: fixed; pointer-events: none; z-index: 900; font-size: 40px; animation: floatUp 1s ease-out forwards; }
  .mood { position: fixed; pointer-events: none; z-index: 950; font-size: 44px; animation: moodPop .8s ease-out forwards; }

  #win {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(60,70,40,.35); z-index: 1100;
  }
  #win.show { display: flex; }
  #win .card { background: #fff; border-radius: 26px; padding: 30px 40px; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,.25); }
  #win .big { font-size: 64px; }
  #win h2 { margin: 10px 0 6px; color: #6b7f3a; font-size: 26px; }
  #win button { margin-top: 14px; font-size: 22px; padding: 12px 34px; border: none; border-radius: 999px; background: #8fb55a; color: #fff; cursor: pointer; }
  #win button:active { transform: scale(.96); }

  .confetti { position: fixed; top: -20px; z-index: 1200; pointer-events: none; animation: fall linear forwards; }

  @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-100px) scale(1.4);opacity:0} }
  @keyframes moodPop { 0%{transform:translateY(0) scale(.3);opacity:0} 25%{transform:translateY(-8px) scale(1.3);opacity:1} 60%{transform:translateY(-16px) scale(1);opacity:1} 100%{transform:translateY(-32px) scale(.9);opacity:0} }
  @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

  /* iPad 大屏适配 */
  @media (min-width: 768px) {
    header { padding: 18px 0 6px; }
    #jars { padding: 14px 40px 0; gap: 20px; }
    #items { gap: 40px; padding: 24px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>🌈 彩虹罐罐</h1>
  <div class="sub">把一样颜色的放一起</div>
</header>
<div id="jars"></div>
<div id="items"></div>
<div id="win">
  <div class="card">
    <div class="big">🎉</div>
    <h2>分得好棒呀！</h2>
    <button id="again">再玩一次</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COLORS = [
    { key: 'red',    name: '红色', jar: '#ef5b6b', lid: '#c94454', emoji: '🍎' },
    { key: 'yellow', name: '黄色', jar: '#f5c84c', lid: '#d9aa2f', emoji: '🍌' },
    { key: 'blue',   name: '蓝色', jar: '#5b9be0', lid: '#3f7bc0', emoji: '🫐' },
    { key: 'green',  name: '绿色', jar: '#6cbf7a', lid: '#4d9c5b', emoji: '🍐' }
  ];

  var ITEMS = [
    { color: 'red',    emoji: '🍓', name: '草莓' },
    { color: 'red',    emoji: '🍎', name: '苹果' },
    { color: 'yellow', emoji: '🍌', name: '香蕉' },
    { color: 'yellow', emoji: '🌽', name: '玉米' },
    { color: 'blue',   emoji: '🫐', name: '蓝莓' },
    { color: 'blue',   emoji: '💧', name: '水滴' },
    { color: 'green',  emoji: '🍐', name: '梨子' },
    { color: 'green',  emoji: '🥦', name: '西兰花' }
  ];

  var jarsEl = document.getElementById('jars');
  var itemsEl = document.getElementById('items');
  var winEl = document.getElementById('win');

  var audioCtx = null;
  function ac() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + t0;
    var o = c.createOscillator(); var g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function correctSound() { tone('sine', 523, null, 0, 0.12, 0.25); tone('sine', 784, null, 0.1, 0.2, 0.22); }
  function wrongSound() { tone('sine', 300, 200, 0, 0.2, 0.2); }
  function winSound() {
    [523, 659, 784, 1047].forEach(function (f, i) { tone('sine', f, null, i * 0.12, 0.25, 0.2); });
  }

  function speak(text) {
    try {
      if ('speechSynthesis' in window) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1.2;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      }
    } catch (e) {}
  }

  function buildJars() {
    COLORS.forEach(function (c) {
      var j = document.createElement('div');
      j.className = 'jar'; j.dataset.color = c.key;
      j.innerHTML = '<div class="lid" style="background:' + c.lid + '"></div>' +
                    '<div class="body" style="background:' + c.jar + '"><span class="cnt">0</span></div>';
      jarsEl.appendChild(j);
    });
  }

  var remaining = 0;
  function buildItems() {
    itemsEl.innerHTML = '';
    ITEMS.forEach(function (it) {
      var d = document.createElement('div');
      d.className = 'item'; d.textContent = it.emoji; d.dataset.color = it.color; d.dataset.name = it.name;
      d.addEventListener('pointerdown', function (e) { onItemTap(d, e); });
      itemsEl.appendChild(d);
    });
    remaining = ITEMS.length;
  }

  function onItemTap(el, e) {
    if (e.cancelable) e.preventDefault();
    if (el.classList.contains('placed')) return;
    var color = el.dataset.color;
    // 目标：找对应的罐子
    var jar = jarsEl.querySelector('.jar[data-color="' + color + '"]');
    var cnt = jar.querySelector('.cnt');
    cnt.textContent = (+cnt.textContent) + 1;

    var r = el.getBoundingClientRect();
    var jr = jar.getBoundingClientRect();
    var targetX = jr.left + jr.width / 2 - (r.left + r.width / 2);
    var targetY = jr.top + jr.height * 0.5 - (r.top + r.height / 2);

    el.style.transform = 'translate(' + targetX + 'px,' + targetY + 'px) scale(.4)';
    el.style.transition = 'transform .45s cubic-bezier(.3,1.2,.4,1)';
    el.classList.add('placed');

    correctSound();
    speak(el.dataset.name);
    spawnStar(jar);
    jar.classList.remove('flash'); void jar.offsetWidth; jar.classList.add('flash');

    remaining--;
    setTimeout(function () {
      if (remaining <= 0) {
        winEl.classList.add('show');
        winSound();
        confetti();
      }
    }, 600);
  }

  function spawnStar(jar) {
    var r = jar.getBoundingClientRect();
    var s = document.createElement('div');
    s.className = 'star'; s.textContent = '⭐';
    s.style.left = (r.left + r.width / 2 - 20) + 'px';
    s.style.top = (r.top - 10) + 'px';
    document.body.appendChild(s);
    setTimeout(function () { s.remove(); }, 1000);
  }

  function confetti() {
    var colors = ['#ef5b6b', '#f5c84c', '#5b9be0', '#6cbf7a', '#f0a1b8'];
    for (var i = 0; i < 50; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.width = (6 + Math.random() * 8) + 'px';
      c.style.height = (6 + Math.random() * 8) + 'px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(function () { c.remove(); }, 4500);
    }
  }

  document.getElementById('again').addEventListener('click', function () {
    winEl.classList.remove('show');
    buildItems();
  });

  buildJars();
  buildItems();
})();
</script>
</body>
</html>
